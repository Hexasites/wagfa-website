# Builds the site and publishes it to the `preview-site` branch.
# Hostinger auto-deploys that branch to the preview subdomain.
# Runs on every push to main, daily (so upcoming/past events stay current), or by hand.
name: Build preview site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *" # 04:17 Perth time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (noindex preview)
        run: node build.mjs --noindex

      - name: Publish site/ to preview-site branch
        run: |
          cd site
          git init -q -b preview-site
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" preview-site
